# nginx sirve la SPA y hace de proxy inverso hacia la API.
# Así el navegador ve un solo origen (sin CORS) y el WebSocket viaja por el mismo puerto.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API REST
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  # Socket.IO: requiere los headers Upgrade/Connection para el WebSocket
  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /health {
    proxy_pass http://backend:3000/health;
  }

  # Archivos con hash: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Fallback de la SPA: React Router resuelve la ruta en el cliente
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
