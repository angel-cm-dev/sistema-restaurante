# Levanta todo el sistema:  docker compose up --build
# Web:  http://localhost:8080   ·   API/Swagger: http://localhost:3000/api/docs
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurante}
      POSTGRES_USER: ${POSTGRES_USER:-restaurante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurante}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-restaurante}:${POSTGRES_PASSWORD:-restaurante}@db:5432/${POSTGRES_DB:-restaurante}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-de-ejemplo-de-32-caracteres-o-mas}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Aplica migraciones siempre y carga datos demo solo si la base está vacía.
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - '3000:3000'

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:8080'

volumes:
  pgdata:
